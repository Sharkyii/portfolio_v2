<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <title>RCA/CAPA Analysis Pipeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#241a0d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="80" y="130" font-size="15" letter-spacing="3" fill="#f59e0b" font-weight="700">AUTOMOBILE · QUALITY INSIGHTS</text>
  <text x="78" y="200" font-size="46" font-weight="700" fill="#f8fafc">RCA/CAPA</text>
  <text x="78" y="254" font-size="46" font-weight="700" fill="#f8fafc">Analysis Pipeline</text>

  <text font-size="20" fill="#94a3b8">
    <tspan x="80" y="300">Clusters recurring defects and turns them into</tspan>
    <tspan x="80" y="330">LLM-written manufacturing insight reports.</tspan>
  </text>

  <g font-size="15" font-weight="600" fill="#f59e0b">
    <rect x="80" y="366" width="196" height="34" rx="17" fill="#241a0a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="178" y="388" text-anchor="middle">TF-IDF + K-Means</text>

    <rect x="290" y="366" width="134" height="34" rx="17" fill="#241a0a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="357" y="388" text-anchor="middle">Qwen2.5-3B</text>

    <rect x="80" y="412" width="112" height="34" rx="17" fill="#241a0a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="136" y="434" text-anchor="middle">8 Charts</text>

    <rect x="206" y="412" width="134" height="34" rx="17" fill="#241a0a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="273" y="434" text-anchor="middle">PDF Report</text>
  </g>

  <text x="80" y="560" font-size="14" fill="#7a6146">tools/projects/Automobile/Manufacturing-Quality-Insights-Module</text>

  <!-- dashboard grid -->
  <g>
    <!-- bar chart card -->
    <rect x="660" y="100" width="225" height="165" rx="14" fill="#161008" stroke="#f59e0b" stroke-width="2"/>
    <text x="678" y="126" font-size="13" fill="#e2b873" font-weight="700">Severity distribution</text>
    <g fill="#f59e0b">
      <rect x="680" y="200" width="20" height="45"/>
      <rect x="712" y="175" width="20" height="70" fill-opacity="0.85"/>
      <rect x="744" y="150" width="20" height="95" fill-opacity="0.7"/>
      <rect x="776" y="190" width="20" height="55" fill-opacity="0.85"/>
      <rect x="808" y="215" width="20" height="30" fill-opacity="0.6"/>
    </g>
    <line x1="672" y1="245" x2="838" y2="245" stroke="#4b3a20" stroke-width="1.5"/>

    <!-- trend chart card -->
    <rect x="905" y="100" width="225" height="165" rx="14" fill="#161008" stroke="#f59e0b" stroke-width="2"/>
    <text x="923" y="126" font-size="13" fill="#e2b873" font-weight="700">Monthly trend</text>
    <polyline points="925,220 960,200 995,230 1030,180 1065,205 1100,160" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#f59e0b">
      <circle cx="925" cy="220" r="4"/><circle cx="960" cy="200" r="4"/><circle cx="995" cy="230" r="4"/>
      <circle cx="1030" cy="180" r="4"/><circle cx="1065" cy="205" r="4"/><circle cx="1100" cy="160" r="4"/>
    </g>
    <line x1="917" y1="245" x2="1113" y2="245" stroke="#4b3a20" stroke-width="1.5"/>

    <!-- heatmap card -->
    <rect x="660" y="285" width="225" height="165" rx="14" fill="#161008" stroke="#f59e0b" stroke-width="2"/>
    <text x="678" y="311" font-size="13" fill="#e2b873" font-weight="700">Severity heatmap</text>
    <g>
      <rect x="678" y="325" width="30" height="24" fill="#f59e0b" fill-opacity="0.9"/>
      <rect x="712" y="325" width="30" height="24" fill="#f59e0b" fill-opacity="0.5"/>
      <rect x="746" y="325" width="30" height="24" fill="#f59e0b" fill-opacity="0.25"/>
      <rect x="780" y="325" width="30" height="24" fill="#f59e0b" fill-opacity="0.7"/>
      <rect x="814" y="325" width="30" height="24" fill="#f59e0b" fill-opacity="0.35"/>

      <rect x="678" y="353" width="30" height="24" fill="#f59e0b" fill-opacity="0.4"/>
      <rect x="712" y="353" width="30" height="24" fill="#f59e0b" fill-opacity="0.9"/>
      <rect x="746" y="353" width="30" height="24" fill="#f59e0b" fill-opacity="0.6"/>
      <rect x="780" y="353" width="30" height="24" fill="#f59e0b" fill-opacity="0.2"/>
      <rect x="814" y="353" width="30" height="24" fill="#f59e0b" fill-opacity="0.55"/>

      <rect x="678" y="381" width="30" height="24" fill="#f59e0b" fill-opacity="0.3"/>
      <rect x="712" y="381" width="30" height="24" fill="#f59e0b" fill-opacity="0.5"/>
      <rect x="746" y="381" width="30" height="24" fill="#f59e0b" fill-opacity="0.85"/>
      <rect x="780" y="381" width="30" height="24" fill="#f59e0b" fill-opacity="0.65"/>
      <rect x="814" y="381" width="30" height="24" fill="#f59e0b" fill-opacity="0.3"/>
    </g>

    <!-- cluster scatter card -->
    <rect x="905" y="285" width="225" height="165" rx="14" fill="#161008" stroke="#f59e0b" stroke-width="2"/>
    <text x="923" y="311" font-size="13" fill="#e2b873" font-weight="700">Complaint clusters</text>
    <g fill="#f59e0b">
      <circle cx="945" cy="340" r="6"/><circle cx="962" cy="355" r="6"/><circle cx="935" cy="362" r="6"/><circle cx="958" cy="332" r="6"/>
    </g>
    <g fill="#ef4444">
      <circle cx="1020" cy="410" r="6"/><circle cx="1040" cy="420" r="6"/><circle cx="1010" cy="425" r="6"/><circle cx="1035" cy="400" r="6"/>
    </g>
    <g fill="#10b981">
      <circle cx="1090" cy="345" r="6"/><circle cx="1105" cy="360" r="6"/><circle cx="1080" cy="365" r="6"/><circle cx="1100" cy="330" r="6"/>
    </g>
  </g>

  <!-- PDF badge -->
  <g>
    <rect x="660" y="465" width="200" height="52" rx="10" fill="#f59e0b"/>
    <text x="682" y="498" font-size="20" font-weight="800" fill="#161008">PDF</text>
    <text x="720" y="498" font-size="14" fill="#161008" font-weight="600">7-page report</text>
  </g>
</svg>
